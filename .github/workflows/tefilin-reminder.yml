name: Tefilin Daily Reminder

on:
  schedule:
    # Every 30 min, 06:00-18:00 UTC = 09:00-21:00 Israel time
    - cron: '0,30 6-18 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytz

      - name: Run bot runner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot_runner.py

      - name: Save state
        run: |
          git config user.name "Tefilin Bot"
          git config user.email "tefilin-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update tefilin state [skip ci]"
          git push origin main || true
